org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Ring transport (shared by BOTH apps; they must match) ----------------
# Messages travel through an ntfy server (https://ntfy.sh or your own).
# The topic name acts as the shared secret on the public server: keep it
# long and random, and do not publish it. Override at build time with
#   ./gradlew assembleDebug -PRING_TOPIC=my-secret-topic
RING_SERVER=https://ntfy.sh
RING_TOPIC=ringbell-130d41afa1d894d1-testing
# Optional bearer token (self-hosted ntfy with auth). Leave empty otherwise.
RING_TOKEN=
