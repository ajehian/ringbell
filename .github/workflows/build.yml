name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew --no-daemon :client:assembleDebug :host:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ring-apks
          path: |
            client/build/outputs/apk/debug/*.apk
            host/build/outputs/apk/debug/*.apk
